name: Ollama Web Panel Heartbeat

on:
  workflow_run:
    workflows: ["Ollama Web Panel 24/7 + Cloudflare Tunnel"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Managed runtime in minutes for dispatched deploy runs (default 300, range 15-345)"
        required: false
        type: string
        default: "300"
      reason:
        description: "Trigger reason (manual, deploy-exit)"
        required: false
        default: "manual"

permissions:
  actions: write
  contents: read

concurrency:
  group: ollama-panel-heartbeat
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check and restart Ollama Web Panel
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REASON: ${{ github.event.inputs.reason }}
          RUNTIME_MINUTES: ${{ github.event.inputs.runtime_minutes || '300' }}
        run: |
          set -euo pipefail
          WF="deploy.yml"
          RAW_RT="${RUNTIME_MINUTES:-300}"
          case "$RAW_RT" in
            ''|*[!0-9]*) SHIFT_MIN=300 ;;
            *) SHIFT_MIN="$RAW_RT" ;;
          esac
          [ "$SHIFT_MIN" -lt 15 ] && SHIFT_MIN=15
          [ "$SHIFT_MIN" -gt 345 ] && SHIFT_MIN=345
          now=$(date +%s)
          mins_since() { echo $(( (now - $(date -d "$1" +%s)) / 60 )); }

          echo "Trigger: ${EVENT_NAME} ${RUN_CONCLUSION:-} ${REASON:-}"
          [ "${REASON:-}" = "deploy-exit" ] && sleep 15
          runs=$(gh run list --repo "$GH_REPO" --workflow "$WF" --limit 30 \
                   --json databaseId,status,conclusion,createdAt,updatedAt,event)

          active=$(echo "$runs" | jq '[.[] | select(.status != "completed")]')
          n_active=$(echo "$active" | jq 'length')

          dispatch() {
            local why="$1"
            for try in 1 2 3; do
              echo "Starting deploy (${why}), attempt ${try}"
              if gh workflow run "$WF" --repo "$GH_REPO" --ref "$REF" -f runtime_minutes="$SHIFT_MIN" -f reason="heartbeat: ${why}"; then
                for _ in $(seq 1 12); do
                  sleep 5
                  newest=$(gh run list --repo "$GH_REPO" --workflow "$WF" --limit 1 --json createdAt --jq '.[0].createdAt')
                  if [ -n "$newest" ] && [ "$(date -d "$newest" +%s)" -ge "$((now - 5))" ]; then
                    echo "Confirmed: new deploy run queued."; return 0
                  fi
                done
                return 0
              fi
              sleep $((try * 10))
            done
            echo "::error::Could not start ${WF}. Check Settings -> Actions -> General -> Workflow permissions."
            return 1
          }

          if [ "$n_active" != "0" ]; then
            stuck=$(echo "$active" | jq -r --argjson now "$now" \
              '[.[] | select(.status == "queued" or .status == "waiting" or .status == "pending")
                    | select(($now - (.createdAt | fromdateiso8601)) > 1200) | .databaseId] | .[]')
            for id in $stuck; do
              echo "Run $id has been queued for 20+ min; cancelling it."
              gh run cancel "$id" --repo "$GH_REPO" || true
            done
            healthy=$(echo "$active" | jq -r --argjson now "$now" --argjson shift "$SHIFT_MIN" \
              '[.[] | select(.status == "in_progress") | select(($now - (.createdAt | fromdateiso8601)) / 60 < $shift)] | length')
            fresh_queued=$(echo "$active" | jq -r --argjson now "$now" \
              '[.[] | select(.status != "in_progress") | select(($now - (.createdAt | fromdateiso8601)) <= 1200)] | length')
            if [ "$healthy" != "0" ] || [ "$fresh_queued" != "0" ]; then
              echo "A deploy is active and within its shift. Nothing to do."
              exit 0
            fi
            echo "Active deploys are all past their shift; starting successor."
            dispatch "successor"
            exit $?
          fi

          fails=$(echo "$runs" | jq '[.[] | select(.status == "completed")] |
                    (map(.conclusion == "success") | index(true)) // length')
          last_end=$(echo "$runs" | jq -r '[.[] | select(.status == "completed")][0].updatedAt // empty')
          since=999
          [ -n "$last_end" ] && since=$(mins_since "$last_end")
          case "$fails" in
            0) backoff=0 ;; 1) backoff=2 ;; 2) backoff=4 ;; 3) backoff=8 ;; 4) backoff=16 ;; *) backoff=30 ;;
          esac
          echo "No active deploy. Consecutive failures: ${fails}, last ended ${since} min ago, back-off ${backoff} min."
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$since" -lt "$backoff" ]; then
            wait_s=$(( (backoff - since) * 60 ))
            if [ "$wait_s" -le 360 ]; then
              echo "Waiting ${wait_s}s before restarting..."
              sleep "$wait_s"
            else
              echo "Backing off; the next heartbeat will retry."
              exit 0
            fi
          fi
          dispatch "restart after ${fails} failure(s)"
